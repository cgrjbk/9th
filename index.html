<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Happy 9th Monthsary Baby</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #120822;
  --bg-gradient: linear-gradient(145deg, #1f0c3a 0%, #120822 100%);
  --card-bg: rgba(255, 255, 255, 0.96);
  --primary: #ff5fa2;
  --primary-dark: #e04387;
  --text-main: #32163b;
  --text-muted: #73537d;
  --accent: #9b51e0;
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  box-sizing: border-box;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg-deep);
  background-image: var(--bg-gradient);
  color: #fff;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
  position: relative;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  z-index: 0;
  pointer-events: none;
  animation: floatOrb 12s ease-in-out infinite alternate;
}
.orb-1 { width: 300px; height: 300px; background: var(--primary); top: -80px; left: -60px; }
.orb-2 { width: 350px; height: 350px; background: var(--accent); bottom: -80px; right: -60px; animation-delay: -6s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, 40px) scale(1.1); }
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: #ffffff;
  border-radius: 50%;
  opacity: 0.2;
  z-index: 0;
  animation: twinkle 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 0.9; transform: scale(1.4); }
}

.app-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 520px;
  height: 100%;
  max-height: 780px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.start-screen {
  text-align: center;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
  width: 100%;
  position: absolute;
  inset: 0;
  z-index: 3;
}

.start-screen.hidden {
  opacity: 0;
  transform: scale(0.92) translateY(-15px);
  pointer-events: none;
  visibility: hidden;
  z-index: 1;
}

.start-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #fff 30%, #ffb9dc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.2;
}

.start-subtitle {
  font-size: 1.1rem;
  color: #d1b3ff;
  margin-bottom: 40px;
  font-weight: 400;
}

.btn-begin {
  background: linear-gradient(135deg, var(--primary) 0%, #ff8cb9 100%);
  color: #fff;
  border: none;
  font-size: 1.25rem;
  font-weight: 600;
  padding: 18px 48px;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(255, 95, 162, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  animation: heartbeat 2s infinite ease-in-out;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  -webkit-tap-highlight-color: transparent;
}

.btn-begin:active {
  transform: scale(0.95);
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.06); }
  30% { transform: scale(1); }
  45% { transform: scale(1.04); }
}

.story-card {
  position: absolute;
  inset: 12px;
  max-height: 720px;
  background: #ffc0cb;
  color: var(--text-main);
  border-radius: 28px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: translateY(40px) scale(0.96);
  pointer-events: none;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  -webkit-overflow-scrolling: touch;
  visibility: hidden;
  z-index: 2;
}

.story-card.active {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
  visibility: visible;
  z-index: 4;
}

.card-header {
  padding: 16px 18px 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(0,0,0,0.08);
  flex-shrink: 0;
  background: rgba(255,255,255,0.55);
  gap: 10px;
}

.step-indicator {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--accent);
  background: rgba(155, 81, 224, 0.15);
  padding: 6px 12px;
  border-radius: 20px;
  white-space: nowrap;
}

.progress-dots {
  display: flex;
  gap: 6px;
  flex: 1;
  justify-content: center;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #e2d1ed;
  transition: background 0.3s ease, width 0.3s ease;
}

.dot.active {
  background: var(--primary);
  width: 20px;
  border-radius: 4px;
}

.btn-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.08);
  color: #5a2d6a;
  font-size: 1.3rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease, transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}

.btn-close:active {
  transform: scale(0.9);
  background: rgba(0,0,0,0.15);
}

.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

.image-container {
  width: 100%;
  height: 250px;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  margin-bottom: 16px;
  background: #f0e6f6;
  flex-shrink: 0;
}

.image-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
  display: block;
}

.text-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

.story-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #240e2b;
  margin-bottom: 8px;
  line-height: 1.3;
}

.story-text {
  font-size: 1.35rem;
  line-height: 1.5;
  color: var(--text-muted);
  font-family: 'Caveat', cursive;
}

.card-footer {
  padding: 16px 20px 20px 20px;
  background: rgba(255,255,255,0.7);
  border-top: 1px solid rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.btn-next {
  width: 100%;
  background: linear-gradient(135deg, var(--accent) 0%, #7b2cbf 100%);
  color: #fff;
  border: none;
  font-size: 1.1rem;
  font-weight: 600;
  padding: 16px;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(123, 44, 191, 0.3);
  transition: transform 0.15s ease, background 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  -webkit-tap-highlight-color: transparent;
}

.btn-next:active {
  transform: scale(0.97);
}

.fade-slide {
  animation: fadeSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.celebration-content {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 20px;
}

.heart-icon {
  font-size: 4rem;
  color: var(--primary);
  margin-bottom: 16px;
  animation: heartbeat 1.5s infinite ease-in-out;
}

@media (max-height: 640px) {
  .image-container {
    height: 180px;
  }
  .story-title {
    font-size: 1.2rem;
  }
  .story-text {
    font-size: 1.2rem;
  }
}
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div id="stars-container"></div>

  <div class="app-wrapper">
    <!-- Initial Start View -->
    <div class="start-screen" id="startScreen">
      <div style="font-size: 3.5rem; margin-bottom: 16px;">💌</div>
      <h1 class="start-title">Happy 9th Monthsary Baby!</h1>
      <p class="start-subtitle">A special message crafted just for you ✨</p>
      <button class="btn-begin" id="beginBtn">
        <span>Open Card</span>
        <span>💖</span>
      </button>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="story-card" id="storyCard">
      <div class="card-header">
        <div class="step-indicator" id="stepIndicator">Step 1 of 5</div>
        <div class="progress-dots" id="progressDots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <button class="btn-close" id="closeBtn" aria-label="Close">×</button>
      </div>

      <div class="card-body" id="cardBody">
        <!-- Dynamic Step Content gets inserted here -->
      </div>

      <div class="card-footer">
        <button class="btn-next" id="nextBtn">
          <span id="nextBtnText">Continue</span>
          <span>→</span>
        </button>
      </div>
    </div>
  </div>

<script>
  const starsContainer = document.getElementById('stars-container');
  for (let i = 0; i < 35; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDelay = (Math.random() * 4) + 's';
    starsContainer.appendChild(star);
  }

  // Segmented message steps from user's heartfelt 9th monthsary note
  const steps = [
    {
      title: "Happy 9th Monthsary, Baby!",
      text: "Hiiiii baby happy 9th monthsary mygoddd hapit na gyod ta 1 year ang bilis lang nang panahon. I would like to thank you for another month with you and thank you for the time, efforts, and our ups and downs, Naa pa gyapon ang never ending love.",
      image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80"
    },
    {
      title: "Endless Love & Missing You",
      text: "I miss you so much naaaaa miskan pa og 1 month lang kapin na wala ta nag kuyog, my god na feel na nko ang gi ingon nmo na murag 1 year na. i will make sure na dili na nmo ma feel after pag laag nko dha, I love you baby",
      image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=800&q=80"
    },
    {
      title: "More Memories to Come",
      text: "I hope more bondings, dates, and cuddles to come because god dili gyod enough miskan pa og unsaon, plus more blessings to come for us!",
      image: "pic.jpeg"
    },
    {
      title: "Always Got Your Back",
      text: "If ever need ko nimo, I will always support you especialy sa upcoming events sa imong life. Thank you talaga baby for being part of my life, you are one of the best things that ever happened to me, and I am super grateful and thankful.",
      image: "pinkflower2.jpg"
    },
    {
      title: "My Forever Love 💕",
      text: "I love you so much babyyy koooo! I know na words are not enough so ehardfck lang tika pag uli nko dha 😉. Once again happy 9th monthsary babyyy i love youuuuu 💗💞",
      image: "https://media.tenor.com/j687jXLdgz0AAAAm/kiss-cute.webp"
    }
  ];

  let currentStep = 0;

  const startScreen = document.getElementById('startScreen');
  const storyCard = document.getElementById('storyCard');
  const beginBtn = document.getElementById('beginBtn');
  const nextBtn = document.getElementById('nextBtn');
  const nextBtnText = document.getElementById('nextBtnText');
  const cardBody = document.getElementById('cardBody');
  const stepIndicator = document.getElementById('stepIndicator');
  const progressDots = document.getElementById('progressDots');
  const closeBtn = document.getElementById('closeBtn');

  function updateDotsCount(total) {
    progressDots.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('div');
      dot.className = `dot ${i === currentStep ? 'active' : ''}`;
      progressDots.appendChild(dot);
    }
  }

  function renderStep() {
    if (currentStep < steps.length) {
      const step = steps[currentStep];
      stepIndicator.textContent = `Step ${currentStep + 1} of ${steps.length}`;
      updateDotsCount(steps.length);

      Array.from(progressDots.children).forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentStep);
      });

      cardBody.innerHTML = `
        <div class="image-container fade-slide">
          <img src="${step.image}" alt="Our Memory" onerror="this.src='https://placehold.co/600x400/e8ccf7/4a2350?text=Our+Memory'">
        </div>
        <div class="text-content fade-slide">
          <h2 class="story-title">${step.title}</h2>
          <p class="story-text">${step.text}</p>
        </div>
      `;

      if (currentStep === steps.length - 1) {
        nextBtnText.textContent = "Finish 💖";
      } else {
        nextBtnText.textContent = "Next Step";
      }
    } else {
      stepIndicator.textContent = "Complete";
      updateDotsCount(steps.length);
      Array.from(progressDots.children).forEach(dot => dot.classList.add('active'));

      cardBody.innerHTML = `
        <div class="celebration-content fade-slide">
          <div class="heart-icon">💖</div>
          <h2 class="story-title" style="font-size: 1.8rem;">Happy 9th Monthsary!</h2>
          <p class="story-text" style="font-size: 1.6rem; margin-top: 10px;">I love you so much baby koo! ✨</p>
        </div>
      `;
      nextBtnText.textContent = "Start Over ↺";
    }
  }

  beginBtn.addEventListener('click', () => {
    startScreen.classList.add('hidden');
    storyCard.classList.add('active');
    currentStep = 0;
    renderStep();
  });

  nextBtn.addEventListener('click', () => {
    currentStep++;
    if (currentStep > steps.length) {
      currentStep = 0;
    }
    renderStep();
  });

  closeBtn.addEventListener('click', () => {
    storyCard.classList.remove('active');
    startScreen.classList.remove('hidden');
    currentStep = 0;
  });
</script>
</body>
</html>
